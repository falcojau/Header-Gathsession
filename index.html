<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/community.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GathSession</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-[#2B2D38] font-poppins mx-30">
    <header class="flex items-center justify-between py-6">
      <nav class="logo">
        <div class="logo">
          <a href="#"><img src="/images/logo-gathsession.png" alt="GathSession Logo" class="w-50"></a>
        </div>
      </nav>
      <nav class="general text-secondary flex gap-10 mr-30">
        <a href="#" class="home group relative">
          Home
          <img src="/images/Rectangle.svg" class="hidden group-hover:block absolute transform bottom-[-3px] left-2" alt="Underline">
        </a>
        <a href="#" class="home group relative">
          Features
          <img src="/images/Rectangle.svg" class="hidden group-hover:block absolute transform bottom-[-3px] left-4" alt="Underline">
        </a>
        <a href="#" class="home group relative">
          Blog
          <img src="/images/Rectangle.svg" class="hidden group-hover:block absolute transform bottom-[-3px] left-0.5" alt="Underline">
        </a>
        <a href="#" class="home group relative">
          Contact
          <img src="/images/Rectangle.svg" class="hidden group-hover:block absolute transform bottom-[-3px] left-4" alt="Underline">
        </a>
        <a href="#" class="home group relative">
          About Us
          <img src="/images/Rectangle.svg" class="hidden group-hover:block absolute transform bottom-[-3px] left-4" alt="Underline">
        </a>
      </nav>
    </header>

    <main class="container mx-auto">
      <div class="hero grid grid-cols-2 gap-20 relative">
        <div class="hero-left relative z-10">
          <div class="hero-left-top my-20">
            <h1 class="text-6xl font-merriweather text-white">
              Build your best community starting from here
            </h1>
            <p class="text-secondary my-7 w-5/6 leading-8">
              Meet and communicate with the best people to run 
              projects, events or other activities in a more 
              effective and fun way
            </p>
            <div class="hero-left-top-buttons flex gap-8 items-center">
              <a href="#" class="bg-[#DB2A6B] text-white text-sm px-10 py-3 rounded-lg hover:bg-[#b82257] transition duration-300">
                Get Started
              </a>
              <a href="#" class="group flex items-center text-white underline text-sm py-3 hover:text-[#DB2A6B] transition duration-300">
                Learn More
                <img src="/images/Arrow.svg" 
                    alt="" 
                    class="ml-2 transform transition-transform duration-300 group-hover:translate-x-1" 
                    aria-hidden="true">
              </a>
            </div>
          </div>

          <article class="hero-left-down flex gap-10">
            <div class="community flex items-center gap-3">
              <img src="/images/community.svg" alt="Community Icon" class="rounded-2xl bg-white/20 p-2 hover:[transform:rotateY(180deg)] transition duration-500">
              <h3 class="text-white text-lg">Build community</h3>
            </div>
            <div class="events flex items-center gap-3">
              <img src="/images/calendar.svg" alt="Events Icon" class="rounded-2xl bg-white/20 p-2 hover:[transform:rotateY(180deg)] transition duration-500">
              <h3 class="text-white text-lg">Share events</h3>
            </div>
            <div class="information flex items-center gap-3">
              <img src="/images/logo-gallery.svg" alt="Information Icon" class="rounded-2xl bg-white/20 p-2 hover:[transform:rotateY(180deg)] transition duration-500">
              <h3 class="text-white text-lg">Get information</h3>
            </div>
          </article>
        </div>

        <div class="hero-right grid grid-cols-3 grid-rows-6 gap-5 h-[600px] mt-10 relative z-10">
          <div class="col-start-1 row-start-1 row-span-4 rounded-4xl overflow-hidden bg-purple-700">
            <img src="/images/serious-orange-man.png" class="w-full h-full object-cover" alt="Serious Orange Man">
          </div>
          <div class="col-start-1 row-start-5 row-span-2 rounded-4xl overflow-hidden bg-pink-700">
            <img src="/images/thinking-woman.png" class="w-full h-full object-cover" alt="Thinking Woman">
          </div>
          <div class="col-start-2 row-start-1 row-span-2 rounded-4xl overflow-hidden bg-cyan-500">
            <img src="/images/asian-girl.png" class="w-full h-full object-cover" alt="Asian Girl">
          </div>
          <div class="col-start-2 row-start-3 row-span-4 rounded-4xl overflow-hidden bg-orange-400">
            <img src="/images/positive-glasses-man.png" class="w-full h-full object-cover" alt="Positive Glasses Man">
          </div>
          <div class="col-start-3 row-start-2 row-span-4 rounded-4xl overflow-hidden bg-amber-300">
            <img src="/images/positive-sunglasses-girl.png" class="w-full h-full object-cover" alt="Positive Sunglasses Girl">
          </div>
        </div>
        <img src="/images/ellipse.svg" alt="elipse" class="bottom-[-50px] right-[-400px] w-400 h-150 absolute z-0 opacity-50">
        <img src="/images/ellipse.svg" alt="elipse" class="bottom-[-50px] right-[-400px] w-250 h-100 absolute z-0 opacity-50">
      </div>
    </main>
  </body>
</html>
